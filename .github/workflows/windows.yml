name: Build Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: Portlight-windows-candidate
          path: release/
          if-no-files-found: error
